# Render.com Blueprint — deploy static site cho app học tiếng Anh
# Publish thư mục webapp/ (HTML/CSS/JS thuần, không cần build)
services:
  - type: web
    name: english-app
    runtime: static
    buildCommand: "echo 'no build step - static site'"
    staticPublishPath: ./webapp
    pullRequestPreviewsEnabled: false
    # Mọi đường dẫn trả về index.html (app điều hướng bằng JS)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
